html<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>USB Loader GX - Wii</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family: 'Fredoka', sans-serif;
    height:100vh; overflow:hidden;
    background: #1e90d5;
    background: radial-gradient(ellipse at center, #6cc8ff 0%, #1e90d5 50%, #0a4a8a 100%);
    display:flex; flex-direction:column;
    color:white;
    cursor: url('https://cur.cursors-4u.net/games/gam-11/gam1082.cur'), auto;
  }

  /* Burbujas de fondo */
  body::before{
    content:'';
    position:absolute; inset:0;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(255,255,255,0.15) 0%, transparent 20%),
      radial-gradient(circle at 90% 80%, rgba(255,255,255,0.1) 0%, transparent 15%);
    pointer-events:none;
  }

  .top-bar{
    height:55px; display:flex; justify-content:center; align-items:center; gap:15px;
    opacity:0.9; z-index:2;
  }
  .top-bar .icon{
    width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.2);
    display:grid; place-items:center; font-size:14px; border:1px solid rgba(255,255,255,0.4);
  }

  .grid-wrap{
    flex:1; display:grid; place-items:center; padding:20px 40px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(7, 130px);
    grid-template-rows: repeat(2, 180px);
    gap:18px 16px;
    transform: perspective(1000px) rotateX(5deg);
  }

  .cover{
    width:130px; height:180px; background:white; border-radius:4px;
    padding:3px; box-shadow: 0 4px 10px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.2);
    transition: all 0.2s ease;
    position:relative;
    cursor:pointer;
  }
  .cover img{ width:100%; height:100%; object-fit:cover; border-radius:2px; display:block; }
  
  .cover:hover{
    transform: translateY(-10px) scale(1.15);
    z-index:10;
    box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 0 3px #fff, 0 0 20px #fff;
  }
  .cover.active{
    transform: translateY(-8px) scale(1.12);
    box-shadow: 0 0 0 3px #fff, 0 0 25px #fff, 0 10px 20px rgba(0,0,0,0.5);
  }

  /* Barra inferior Wii style */
  .bottom-bar{
    height:70px; display:flex; align-items:center; justify-content:space-between;
    padding:0 30px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.0), rgba(0,0,0,0.3));
  }

  .bottom-left, .bottom-right{ display:flex; align-items:center; gap:25px; }
  
  .wii-btn{
    width:70px; height:70px; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.15));
    border:2px solid rgba(255,255,255,0.5);
    display:grid; place-items:center;
    font-size:32px; backdrop-filter: blur(5px);
    box-shadow: inset 0 0 20px rgba(255,255,255,0.5), 0 4px 10px rgba(0,0,0,0.3);
    transition:0.2s;
  }
  .wii-btn:hover{ transform:scale(1.1); background:white; color:#1e90d5; }

  .clock{
    font-family: monospace; font-size:22px; letter-spacing:3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5); opacity:0.9;
  }

  .sd-icons{ display:flex; gap:15px; align-items:center; font-size:14px; opacity:0.8; }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="icon">★</div>
    <div class="icon">☁</div>
    <div class="icon">ABC</div>
    <div class="icon">♡</div>
    <div class="icon">▦</div>
    <div class="icon">◐</div>
    <div class="icon">⚙</div>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid">
      <!-- Usa tus ISOs aquí -->
      <div class="cover"><img src="https://i.imgur.com/1.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/2.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/3.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/4.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/5.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/6.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/7.jpg"></div>

      <div class="cover"><img src="https://i.imgur.com/8.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/9.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/10.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/11.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/12.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/13.jpg"></div>
      <div class="cover"><img src="https://i.imgur.com/14.jpg"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-left">
      <div class="wii-btn">🛠</div>
      <div class="wii-btn">⌂</div>
      <div class="clock" id="clock">22:37</div>
    </div>
    <div class="bottom-right">
      <div class="sd-icons">
        <span>SD</span> <span>home<br>brew</span>
      </div>
      <div class="wii-btn">+</div>
      <div class="wii-btn">⏻</div>
    </div>
  </div>

<script>
  // Reloj real como en tu foto
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ' ' + d.getMinutes().toString().padStart(2,'0');
  }
  setInterval(tick,1000); tick();

  // Navegación tipo Wiimote con flechas
  const covers = document.querySelectorAll('.cover');
  let idx = 11;
  function update(){ covers.forEach((c,i)=>c.classList.toggle('active', i===idx)); }
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight') idx = (idx+1)%covers.length;
    if(e.key==='ArrowLeft') idx = (idx-1+covers.length)%covers.length;
    if(e.key==='ArrowDown') idx = Math.min(covers.length-1, idx+7);
    if(e.key==='ArrowUp') idx = Math.max(0, idx-7);
    update();
  });
  covers.forEach((c,i)=>c.addEventListener('click',()=>{ idx=i; update(); }));
</script>
</body>
</html>
